
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>ALERT360 | Smart Weather Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --bg:#07111f; --panel:#101e30; --panel2:#14243a;
  --line:#25374c; --text:#eef6ff; --muted:#91a5bd;
  --blue:#50b8ff; --cyan:#55f0db; --purple:#9a8bff;
  --orange:#ffba69; --red:#ff7185;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at 20% 0%,#132d49 0,transparent 40%),var(--bg);
  color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh
}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1450px;margin:auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#48baff,#7068ff);font-size:25px;box-shadow:0 0 30px #398bff44}
h1{font-size:22px;margin:0;letter-spacing:1px}
.brand p{margin:5px 0 0;color:var(--muted);font-size:12px}
.status{font-size:12px;color:var(--cyan);border:1px solid #24594f;border-radius:30px;padding:9px 13px}
.status:before{content:"●";margin-right:8px}
.search{display:flex;gap:8px;width:100%;max-width:470px}
.search input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);color:white;border-radius:12px;padding:13px 15px;outline:none}
.search input:focus{border-color:var(--blue)}
.btn{border:0;border-radius:12px;padding:12px 15px;background:linear-gradient(135deg,#45b9ff,#726aff);color:white;font-weight:700}
.btn.secondary{background:#20334a;border:1px solid var(--line)}
.section-title{font-size:14px;color:var(--muted);margin:26px 0 13px;font-weight:600;letter-spacing:.6px}
.grid{display:grid;gap:15px}
.hero-grid{grid-template-columns:1.3fr 1fr}
.card{background:linear-gradient(145deg,#13243a,#0d1929);border:1px solid var(--line);border-radius:20px;padding:21px;min-width:0;box-shadow:0 12px 35px #00000013}
.hero{position:relative;overflow:hidden;min-height:260px}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#43a9ff13;right:-65px;top:-70px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.city{font-size:25px;font-weight:800;margin-top:9px}
.date{font-size:12px;color:var(--muted);margin-top:6px}
.temp-row{display:flex;align-items:center;gap:18px;margin-top:20px}
.big-icon{font-size:64px;filter:drop-shadow(0 0 20px #65baff45)}
.temperature{font-size:65px;font-weight:800;letter-spacing:-4px;line-height:1}
.condition{color:#c4d6e9;margin-top:8px;font-size:14px}
.feels{font-size:12px;color:var(--muted);margin-top:9px}
.hero-bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pill{background:#1c3147;border:1px solid #2b435a;padding:9px 11px;border-radius:10px;font-size:12px;color:#d6e7f7}
.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric{min-height:122px}
.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.metric-icon{font-size:21px}
.metric-value{font-size:27px;font-weight:800;margin-top:17px}
.metric-sub{font-size:11px;color:var(--muted);margin-top:6px}
.forecast{grid-template-columns:repeat(7,minmax(0,1fr))}
.day{padding:16px 7px;text-align:center}
.day-name{font-size:11px;color:var(--muted)}
.day-icon{font-size:27px;margin:15px 0}
.day-temp{font-size:13px;font-weight:700}
.day-low{font-size:11px;color:var(--muted);margin-top:6px}
.hourly{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px}
.hour{flex:0 0 85px;text-align:center;background:#14263b;border:1px solid #273b51;border-radius:14px;padding:15px 8px}
.hour-time{font-size:11px;color:var(--muted)}
.hour-icon{font-size:25px;margin:13px 0}
.hour-temp{font-size:16px;font-weight:700}
.hour-rain{font-size:10px;color:var(--cyan);margin-top:8px}
.two-col{grid-template-columns:1fr 1fr}
.aqi-value{font-size:35px;font-weight:800;margin:12px 0 5px}
.aqi-bar{height:8px;border-radius:20px;background:linear-gradient(90deg,#5be0a1,#c8df65,#ffca72,#ff7b76,#a88aff);margin:18px 0 9px}
.aqi-label{font-size:12px;color:var(--muted)}
.small-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.small-stat{background:#172940;padding:13px;border-radius:12px}
.small-stat span{font-size:11px;color:var(--muted)}
.small-stat strong{display:block;font-size:18px;margin-top:7px}
.alerts{display:grid;gap:10px}
.alert{display:flex;gap:12px;padding:14px;background:#172940;border-radius:13px;border:1px solid #2a4058}
.alert-symbol{font-size:22px}
.alert strong{font-size:13px}
.alert p{font-size:12px;color:var(--muted);line-height:1.6;margin:5px 0 0}
#map{height:340px;border-radius:15px;z-index:1}
.map-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}
.chart-wrap{height:250px;position:relative}
footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;padding:28px 8px}
.loading{color:var(--cyan);font-size:12px;margin-top:10px}
.error{color:var(--orange)}
.full{grid-column:1/-1}
@media(max-width:850px){
 .hero-grid,.two-col{grid-template-columns:1fr}
 .forecast{grid-template-columns:repeat(4,minmax(0,1fr))}
 .wrap{padding:15px}
 .search{max-width:none}
}
@media(max-width:430px){
 .temperature{font-size:54px}
 .big-icon{font-size:50px}
 .card{padding:16px}
 .forecast{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
 .day{padding:13px 3px}
 h1{font-size:19px}
}
</style>
</head>
